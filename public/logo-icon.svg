<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="cs2live-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="ping-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep stealth backdrop (rounded square) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#09090b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Outer subtle radar ring -->
  <circle cx="32" cy="32" r="21" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Inner precision radar ring -->
  <circle cx="32" cy="32" r="14" stroke="url(#cs2live-grad)" stroke-width="1.75" stroke-opacity="0.9" />

  <!-- Precision tactical crosshair lines with center aperture gap -->
  <!-- Top notch -->
  <line x1="32" y1="7" x2="32" y2="15" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <!-- Bottom notch -->
  <line x1="32" y1="49" x2="32" y2="57" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <!-- Left notch -->
  <line x1="7" y1="32" x2="15" y2="32" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <!-- Right notch -->
  <line x1="49" y1="32" x2="57" y2="32" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

  <!-- Inner reticle hair lines -->
  <line x1="32" y1="22" x2="32" y2="26" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="38" x2="32" y2="42" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round" />
  <line x1="22" y1="32" x2="26" y2="32" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round" />
  <line x1="38" y1="32" x2="42" y2="32" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round" />

  <!-- Center pulse glow -->
  <circle cx="32" cy="32" r="7" fill="url(#ping-glow)" />
  <!-- Center active ping dot -->
  <circle cx="32" cy="32" r="2.75" fill="#10b981" />
  <circle cx="32" cy="32" r="1.25" fill="#ffffff" />
</svg>
