<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-live-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Icon group (40x40 at x=5, y=5) -->
  <g transform="translate(5, 5)">
    <rect width="40" height="40" rx="10" fill="#09090b" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
    <circle cx="20" cy="20" r="14" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2" stroke-dasharray="2 2" />
    <circle cx="20" cy="20" r="9" stroke="#10b981" stroke-width="1.5" />
    <!-- Tactical notches -->
    <line x1="20" y1="3" x2="20" y2="8" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
    <line x1="20" y1="32" x2="20" y2="37" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
    <line x1="3" y1="20" x2="8" y2="20" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
    <line x1="32" y1="20" x2="37" y2="20" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
    <!-- Reticle Center -->
    <circle cx="20" cy="20" r="2.5" fill="#10b981" />
    <circle cx="20" cy="20" r="1" fill="#ffffff" />
  </g>

  <!-- Typography group -->
  <!-- "CS2" Text -->
  <text x="56" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">CS2</text>

  <!-- "LIVE" Text -->
  <text x="105" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="url(#logo-live-grad)" letter-spacing="1.5">LIVE</text>

  <!-- Subtle pulse indicator dot after "LIVE" -->
  <circle cx="168" cy="24" r="3.5" fill="#10b981" opacity="0.9" />
  <circle cx="168" cy="24" r="1.5" fill="#ffffff" />

  <!-- Domain badge / extension ".TOP" -->
  <rect x="178" y="16" width="34" height="16" rx="4" fill="#18181b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <text x="184" y="28" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#a1a1aa" letter-spacing="0.5">.TOP</text>
</svg>
